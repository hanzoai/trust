name: CI/CD

# The gate for hanzoai/trust, on the native runners (git.hanzo.ai → git-runner).
# The caller shape is triggers plus the import; all real config lives in the
# repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# It is `.hanzo/workflows` and NOT `.github/workflows`: the forge collects
# workflows from the FIRST of WORKFLOW_DIRS that exists in the pushed commit and
# ignores the rest, so once this directory exists a `.github/workflows` beside
# it is dark config. And the default runner label is advertised only by runners
# registered to git.hanzo.ai — a job asking for it on github.com is never
# assigned and sits until the 24h timeout rather than failing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
